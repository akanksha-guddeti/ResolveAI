<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ResolveAI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc,
                    #e0f2fe
                );
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.12);

            text-align: center;
        }

        .logo {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            border-radius: 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #4f46e5;
            color: white;

            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #d1d5db;
            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #4f46e5;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .back-link {
            display: inline-block;

            margin-top: 20px;

            text-decoration: none;

            color: #4f46e5;

            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .demo {
            margin-top: 25px;

            padding: 12px;

            background: #f3f4f6;

            border-radius: 10px;

            font-size: 13px;

            color: #4b5563;
        }

        .demo strong {
            color: #111827;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                R
            </div>

            <h1>ResolveAI</h1>

            <p class="subtitle">
                Admin Dashboard Login
            </p>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <form method="POST">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter admin username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login to Dashboard
                </button>

            </form>


            <div class="demo">

                <strong>Demo Login</strong><br>

                Username: admin<br>
                Password: admin123

            </div>


            <a href="/" class="back-link">
                ← Back to ResolveAI
            </a>

        </div>

    </div>

</body>

</html>
